<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Automated Document Capture</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef3f8;
            font-family: "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #1f2e43;
            margin-bottom: 5px;
        }

        h4 {
            color: #6c7a8d;
            margin-top: 0;
            font-weight: 500;
        }

        input[type="email"], input[type="password"] {
            width: 90%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .remember {
            margin-top: 10px;
            text-align: left;
            padding-left: 20px;
        }

        button {
            margin-top: 20px;
            width: 95%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        a {
            color: #0056b3;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .links {
            margin-top: 15px;
        }

        .error {
            margin-top: 15px;
            color: red;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="login-box">

        <h2>Welcome Back</h2>
        <h4>Automated Document Capture</h4>

        <form method="post" action="/login">

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <div class="remember">
                <input type="checkbox" name="remember"> Remember Me
            </div>

            <button type="submit">Login</button>

            <div class="links">
                <a href="/forgot-password">Forgot Password?</a><br><br>
                <span>Don't have an account? <a href="/register">Register</a></span>
            </div>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

        </form>
    </div>
</div>

</body>
</html>
