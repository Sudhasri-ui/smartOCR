<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            background: #f0f4ff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 { color: #1f2e43; }

        input[type="email"] {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1e4fc6; }

        .error { color: red; margin-top: 12px; }
        .success { color: green; margin-top: 12px; }

        a { text-decoration: none; color: #2563eb; }
    </style>
</head>
<body>

<div class="box">
    <h2>Forgot Password</h2>
    <p>Enter your registered email</p>

    <form method="post">
        <input type="email" name="email" placeholder="Enter Email" required>
        <button type="submit">Next</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <br>
    <a href="/">Back to Login</a>
</div>

</body>
</html>
