<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Automated Document Capture</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef3f8;
            font-family: "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #1f2e43;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 95%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        .links {
            margin-top: 15px;
        }

        a {
            color: #0056b3;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            margin-top: 15px;
            color: red;
        }

        .success {
            margin-top: 15px;
            color: green;
        }

    </style>

</head>
<body>

<div class="container">
    <div class="box">

        <h2>Create Account</h2>

        <form method="post" action="/register">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Register</button>

            <div class="links">
                Already have an account?
                <a href="/login">Login</a>
            </div>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            {% if success %}
                <p class="success">{{ success }}</p>
            {% endif %}

        </form>

    </div>
</div>

</body>
</html>
