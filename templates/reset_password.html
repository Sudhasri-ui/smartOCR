<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Automated Document Capture</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef3f8;
            font-family: "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #1f2e43;
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            width: 95%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        a {
            color: #0056b3;
            text-decoration: none;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

    </style>

</head>

<body>

<div class="container">
    <div class="reset-box">

        <h2>Create New Password</h2>

        <form method="post" action="/reset-password">
            <input type="hidden" name="email" value="{{ email }}">

            <input type="password" name="password" placeholder="Enter New Password" required>

            <button type="submit">Reset Password</button>

            {% if success %}
            <p class="success">{{ success }}</p>
            {% endif %}

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

        </form>

        <p style="margin-top: 15px;">
            <a href="/login">Back to Login</a>
        </p>

    </div>
</div>

</body>
</html>
