<!DOCTYPE html>
<html>
<head>
    <title>Automated Document Capture</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        body { font-family: Arial; background:#f8fafc; padding:20px; }

        .row { display:flex; gap:20px; }
        .card {
            background:white; padding:20px; border-radius:12px;
            box-shadow:0 3px 12px rgba(0,0,0,0.1);
            width:48%;
        }
        .title { font-size:22px; font-weight:700; margin-bottom:10px; }

        input, select {
            width:100%; padding:10px; margin:5px 0 15px 0;
            border:1px solid #ccc; border-radius:6px;
        }
        button {
            background:#2563eb; color:white; padding:10px 16px;
            border:none; border-radius:6px; cursor:pointer;
        }
        button:hover { background:#1d4ed8; }
        table { width:100%; border-collapse: collapse; margin-top:15px; }
        th, td { padding:8px; border-bottom:1px solid #e5e7eb; }
        th { background:#2563eb; color:white; }
    </style>
</head>

<body>

<h1>Automated Document Capture</h1>

<!-- UPLOAD CARD -->
<div class="card" style="width:96%;">
    <h2>Select Meter Reading Sheet (PDF)</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label class="file-label">
            <input type="file" name="pdf_file" id="pdfInput" accept="application/pdf">
        </label>

        <button type="submit">Upload PDF</button>
    </form>

    {% if file_url %}
        <p style="margin-top:10px;color:green;">✔ Uploaded successfully</p>
        <p><b>Uploaded File:</b> {{ file_url }}</p>
    {% endif %}
</div>

<!-- ROW: PDF PREVIEW + EXTRACTED DATA -->
<div class="row">

    <!-- PDF PREVIEW LEFT -->
    <div class="card">
        <div class="title">PDF Preview</div>

        {% if file_url %}
        <canvas id="pdfViewer" style="width:100%;border:1px solid #ccc;"></canvas>
        {% endif %}

        {% if file_url %}
        <button onclick="parsePDF()">Parse Sheet</button>
        {% endif %}
    </div>

    <!-- RIGHT: EXTRACTED DATA -->
    <div class="card">
        <div class="title">Extracted Data</div>

        <div id="sheetInfo"></div>
        <hr>
        <div id="propertyGrid"></div>

        <button id="saveBtn" style="margin-top:20px; display:none;" onclick="saveToDB()">Save to Database</button>
    </div>
</div>

<script>
// ---------------- AUTO LOAD PDF PREVIEW ----------------
{% if file_url %}
const pdfPath = "{{ file_url }}";

pdfjsLib.getDocument(pdfPath).promise.then(pdf => {
    pdf.getPage(1).then(page => {
        const canvas = document.getElementById("pdfViewer");
        const ctx = canvas.getContext("2d");
        const viewport = page.getViewport({ scale: 1.3 });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        page.render({ canvasContext: ctx, viewport });
    });
});
{% endif %}

// ---------------- PARSE PDF (CALL FLASK API) ----------------
function parsePDF() {
    fetch("/parse", { method: "POST" })
        .then(res => res.json())
        .then(data => {
            document.getElementById("sheetInfo").innerHTML = buildSheetInfo(data.sheet);
            document.getElementById("propertyGrid").innerHTML = buildPropertyGrid(data.properties);

            document.getElementById("saveBtn").style.display = "block";
        });
}

// ----------- BUILD TECHNICIAN INFO CARD ----------------
function buildSheetInfo(d) {
    return `
    <h3>Sheet Info</h3>
    <label>Technician Name</label>
    <input value="${d.name}">
    <label>Employee ID</label>
    <input value="${d.emp_id}">
    <label>Date</label>
    <input value="${d.date}">
    <label>Route/Zone</label>
    <input value="${d.zone}">
    <label>Start Time</label>
    <input value="${d.start}">
    <label>End Time</label>
    <input value="${d.end}">
    <h3>Summary Statistics</h3>
    <input value="${d.total}">
    `;
}

// ---------------- PROPERTY GRID ----------------
function buildPropertyGrid(rows) {
    let h = `<h3>Property Grid (${rows.length})</h3><table><tr>
        <th>Address</th><th>Meter #</th><th>Prev</th><th>Current</th><th>Units</th><th>Status</th></tr>`;

    rows.forEach(r => {
        h += `<tr>
            <td>${r.address}</td>
            <td>${r.meter}</td>
            <td>${r.previous}</td>
            <td>${r.current}</td>
            <td>${r.units}</td>
            <td>${r.status}</td>
        </tr>`;
    });

    h += `</table>`;
    return h;
}

// ---------------- SAVE TO DATABASE ----------------
function saveToDB() {
    fetch("/save", { method: "POST" })
        .then(res => res.json())
        .then(msg => alert(msg.status));
}
</script>

</body>
</html>
