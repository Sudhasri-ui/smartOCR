name: Deploy to Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "github-actions"

    - name: Push to Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE: ${{ secrets.HF_SPACE }}
      run: |
        if [ -z "${HF_TOKEN}" ] || [ -z "${HF_SPACE}" ]; then
          echo "Missing HF_TOKEN or HF_SPACE secrets"
          exit 1
        fi
        git remote add hf https://huggingface.co/spaces/${HF_SPACE}.git || true
        git push --force https://${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git HEAD:main
